# Single-file compose for Coolify (Docker Compose build pack) with NVIDIA GPU passthrough.
# Requirements on the Coolify host / LXC: NVIDIA user-space driver + nvidia-container-toolkit, GPU devices
# passed into the LXC (see README "Coolify / Proxmox LXC"). Without a GPU use the CPU image instead
# (drop the `deploy` block and the TENSORFLOW_PACKAGE build arg).
services:
  app:
    build:
      context: .
      args:
        TENSORFLOW_PACKAGE: "tensorflow[and-cuda]==2.19.0"
    image: wakeword-trainer:gpu
    expose:
      - "8000"
    volumes:
      - wakeword-data:/data
    environment:
      - APP_USER=${APP_USER:-admin}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - KEEP_JOBS=${KEEP_JOBS:-10}
      - PUBLIC_URL=${PUBLIC_URL:-}
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  wakeword-data:
